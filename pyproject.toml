[project]
name = "hybrid-rag-pipeline"
version = "0.1.0"
description = "Hybrid RAG (vector + BM25 + RRF + cross-encoder) for cited answers over operations documentation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.25.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Synthetic corpus source contains long strings formatted as data.
"scripts/generate_docs.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "context",
    "contracts",
    "core",
    "generation",
    "ingest",
    "prompting",
    "retrieval",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
